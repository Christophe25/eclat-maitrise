<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="2048" height="2048"></canvas>
<script>
// Retouche de l'illustration Gemini de l'épisode 2 :
//  1) « JIDOKA (Qualité à la Source) » en double (bas gauche) → « FLUX TIRÉ »
//  2) « SDIVI SUIVI VSM » sur le carnet → « SUIVI VSM »
const SRC = new URLSearchParams(location.search).get('src');

// Couleur moyenne des pixels clairs seulement (ignore l'encre et les traits)
function paperColor(ctx, x, y, w, h, minLum = 170) {
  const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    if (l >= minLum) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}

function avgColor(ctx, x, y, w, h) {
  const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}

// Recouvre une zone avec une couleur de fond, bords adoucis
function patch(ctx, color, x, y, w, h, angle = 0, feather = 10) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(angle * Math.PI / 180);
  ctx.filter = `blur(${feather}px)`;
  ctx.fillStyle = color;
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.filter = 'none';
  ctx.fillRect(-w / 2 + feather, -h / 2 + feather / 2, w - 2 * feather, h - feather);
  ctx.restore();
}

function goldText(ctx, text, cx, cy, size) {
  ctx.save();
  ctx.font = `700 ${size}px Montserrat`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
  g.addColorStop(0, '#f3d79b'); g.addColorStop(0.5, '#d9ac5c'); g.addColorStop(1, '#a8772f');
  ctx.shadowColor = 'rgba(230,180,90,.35)'; ctx.shadowBlur = 6;
  ctx.fillStyle = g; ctx.fillText(text, cx, cy);
  ctx.restore();
}

function inkText(ctx, text, cx, cy, size, angle, color) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(angle * Math.PI / 180);
  ctx.font = `700 ${size}px Montserrat`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  ctx.restore();
}

(async () => {
  await document.fonts.load('700 40px Montserrat');
  const img = new Image(); img.src = SRC; await img.decode();
  const ctx = document.getElementById('c').getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  // 1) Bas gauche : fond noir texturé
  const bg1 = avgColor(ctx, 1000, 1395, 30, 60);
  patch(ctx, bg1, 672, 1392, 334, 96, 0, 8);
  goldText(ctx, 'FLUX TIRÉ', 836, 1438, 44);

  // 2) Carnet : papier crème, texte incliné
  // Bandeau d'en-tête du carnet (quadrilatère suivant la perspective)
  const paper = paperColor(ctx, 1215, 1560, 230, 70);
  const quad = [[1208, 1586], [1445, 1526], [1448, 1560], [1208, 1614]];
  ctx.save();
  ctx.fillStyle = paper;
  ctx.filter = 'blur(3px)';
  ctx.beginPath(); quad.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
  ctx.filter = 'none'; ctx.fill();
  ctx.restore();
  // Trait supérieur du tableau, partiellement recouvert : on le redessine
  ctx.save();
  ctx.strokeStyle = '#1d1712'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(1355, 1585.8); ctx.lineTo(1471, 1551.5); ctx.stroke();
  ctx.restore();
  inkText(ctx, 'SUIVI VSM', 1326, 1572, 28, -13.5, '#241b13');

  document.title = 'done';
})();
</script>
</body></html>
