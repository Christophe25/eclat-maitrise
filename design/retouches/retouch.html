<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="2048" height="2048"></canvas>
<script>
// Retouches des illustrations Gemini (originaux 2048 × 2048 : ep-N-gemini.jpg).
// Usage : retouch.html?ep=N  → rendu à capturer avec Chrome headless.
//
// Toutes les images : suppression du titre « L'ÉCLAT MAÎTRISÉ ».
// Épisode 1 : « JOAILLERIE & LEAN MANAGEMENT » remonté en titre.
// Épisodes 2 à 4 : suppression de « JOAILLERIE & LEAN MANAGEMENT », de la ligne
// « ÉPISODE N » et du thème, puis thème réécrit en haut, en taille de titre.
// Épisode 2 : corrections de texte (doublon Jidoka, faute sur le carnet).

const EP = Number(new URLSearchParams(location.search).get('ep'));

// Zones à effacer [x0, y0, x1, y1] (coordonnées de l'original 2048 px)
const ERASE = {
  1: [[432, 88, 1622, 250], [440, 250, 1620, 322]],
  2: [[432, 88, 1622, 250], [450, 250, 1620, 320, 'top'], [850, 320, 1200, 421, 'top'], [500, 421, 1555, 496, 'top']],
  3: [[400, 70, 1650, 250], [178, 236, 1870, 334], [560, 320, 1510, 421, 'top'], [690, 421, 1360, 496, 'top']],
  4: [[400, 70, 1650, 250], [178, 236, 1870, 334], [560, 320, 1510, 421, 'top'], [735, 421, 1315, 496, 'top']],
};

// Thème réécrit en haut, en taille de titre : lignes, centres verticaux, largeur max
const TITLE = {
  1: { lines: ['JOAILLERIE &', 'LEAN MANAGEMENT'], y: [175, 300], maxWidth: 1150, maxSize: 118 },
  2: { lines: ['L’EXCELLENCE', 'OPÉRATIONNELLE'], y: [175, 300], maxWidth: 1150, maxSize: 118 },
  3: { lines: ['LES 7 GASPILLAGES'], y: [185], maxWidth: 1220, maxSize: 132 },
  4: { lines: ['LE 5S À L’ÉTABLI'], y: [185], maxWidth: 1220, maxSize: 132 },
};

const lum = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;

// Reconstitue le fond de toutes les zones à la fois par diffusion (inpainting
// harmonique multi-échelle) : chaque pixel effacé prend la moyenne de ses voisins,
// jusqu'à un fond continu qui raccorde partout avec le pourtour, sans raccords.
// Les pixels clairs du pourtour (texte, ornements) sont assombris pour ne pas
// « baver » dans la zone. Un léger grain imite ensuite la texture.
// Une zone est soit un rectangle [x0, y0, x1, y1], soit un arc
// { arc: [cx, cy, r0, r1, a0, a1] } (angles en degrés, y vers le bas).
function zoneBox(z) {
  if (!z.arc) return z;
  const [cx, cy, , r1] = z.arc; return [cx - r1, cy - r1, cx + r1, cy + r1];
}
function inZone(z, x, y) {
  if (!z.arc) return x >= z[0] && x < z[2] && y >= z[1] && y < z[3];
  const [cx, cy, r0, r1, a0, a1] = z.arc;
  const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy);
  const a = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  return r >= r0 && r <= r1 && a >= a0 && a <= a1;
}
function eraseAll(ctx, zones, { cap = true } = {}) {
  if (!zones.length) return;
  const boxes = zones.map(zoneBox);
  const M = 24;
  let bx0 = Math.min(...boxes.map(z => z[0])) - M, by0 = Math.min(...boxes.map(z => z[1])) - M;
  let bx1 = Math.max(...boxes.map(z => z[2])) + M, by1 = Math.max(...boxes.map(z => z[3])) + M;
  bx0 = Math.max(0, bx0); by0 = Math.max(0, by0); bx1 = Math.min(2048, bx1); by1 = Math.min(2048, by1);
  const w = bx1 - bx0, h = by1 - by0, N = w * h;
  const img = ctx.getImageData(bx0, by0, w, h);
  const mask = new Uint8Array(N);
  zones.forEach((z, k) => {
    const [x0, y0, x1, y1] = boxes[k];
    for (let y = Math.max(by0, y0); y < Math.min(by1, y1); y++) for (let x = Math.max(bx0, x0); x < Math.min(bx1, x1); x++)
      if (inZone(z, x, y)) mask[(y - by0) * w + (x - bx0)] = 1;
  });
  const C = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
  const CAP = 55;
  for (let i = 0; i < N; i++) {
    let r = img.data[i * 4], g = img.data[i * 4 + 1], b = img.data[i * 4 + 2];
    const l = lum(r, g, b);
    if (cap && !mask[i] && l > CAP) { const f = CAP / l; r *= f; g *= f; b *= f; }
    C[0][i] = r; C[1][i] = g; C[2][i] = b;
  }

  // 1) Grossier (cellules de 8 px) : beaucoup d'itérations pour les grandes longueurs d'onde
  const F = 8, cw = Math.ceil(w / F), ch = Math.ceil(h / F), CN = cw * ch;
  const cknown = new Uint8Array(CN), cv = [new Float32Array(CN), new Float32Array(CN), new Float32Array(CN)];
  for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
    let n = 0, s0 = 0, s1 = 0, s2 = 0;
    for (let y = cy * F; y < Math.min(h, cy * F + F); y++) for (let x = cx * F; x < Math.min(w, cx * F + F); x++) {
      const i = y * w + x; if (!mask[i]) { n++; s0 += C[0][i]; s1 += C[1][i]; s2 += C[2][i]; }
    }
    const k = cy * cw + cx;
    if (n > F * F / 2) { cknown[k] = 1; cv[0][k] = s0 / n; cv[1][k] = s1 / n; cv[2][k] = s2 / n; }
    else { cv[0][k] = 20; cv[1][k] = 20; cv[2][k] = 22; }
  }
  for (let it = 0; it < 3000; it++) {
    for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
      const k = cy * cw + cx; if (cknown[k]) continue;
      for (let c = 0; c < 3; c++) {
        let s = 0, n = 0;
        if (cx > 0) { s += cv[c][k - 1]; n++; } if (cx < cw - 1) { s += cv[c][k + 1]; n++; }
        if (cy > 0) { s += cv[c][k - cw]; n++; } if (cy < ch - 1) { s += cv[c][k + cw]; n++; }
        cv[c][k] = s / n;
      }
    }
  }
  // 2) Initialisation pleine résolution par interpolation bilinéaire du grossier
  const sample = (c, fx, fy) => {
    const x = Math.min(cw - 1, Math.max(0, fx)), y = Math.min(ch - 1, Math.max(0, fy));
    const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(cw - 1, x0 + 1), y1 = Math.min(ch - 1, y0 + 1);
    const tx = x - x0, ty = y - y0;
    return (cv[c][y0 * cw + x0] * (1 - tx) + cv[c][y0 * cw + x1] * tx) * (1 - ty) +
           (cv[c][y1 * cw + x0] * (1 - tx) + cv[c][y1 * cw + x1] * tx) * ty;
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (!mask[i]) continue;
    for (let c = 0; c < 3; c++) C[c][i] = sample(c, x / F - 0.5, y / F - 0.5);
  }
  // 3) Affinage pleine résolution (raccord précis avec le pourtour)
  for (let it = 0; it < 120; it++) {
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x; if (!mask[i]) continue;
      for (let c = 0; c < 3; c++) C[c][i] = (C[c][i - 1] + C[c][i + 1] + C[c][i - w] + C[c][i + w]) / 4;
    }
  }
  // 4) Grain et écriture
  let seed = 1234;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) - 0.5;
  for (let i = 0; i < N; i++) {
    if (!mask[i]) continue;
    const n = rand() * 5;
    img.data[i * 4] = C[0][i] + n; img.data[i * 4 + 1] = C[1][i] + n; img.data[i * 4 + 2] = C[2][i] + n;
  }
  ctx.putImageData(img, bx0, by0);
}

// Titre doré gravé, police à empattements (proche de l'ancien « L'ÉCLAT MAÎTRISÉ »)
function drawTitle(ctx, { lines, y, maxWidth, maxSize }) {
  const font = size => `800 ${size}px Cinzel`;
  let size = maxSize;
  ctx.font = font(size);
  while (size > 40 && Math.max(...lines.map(l => ctx.measureText(l).width)) > maxWidth) ctx.font = font(--size);
  lines.forEach((text, i) => {
    const cy = y[i];
    ctx.save();
    ctx.font = font(size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // halo doux
    ctx.shadowColor = 'rgba(240,190,100,.45)'; ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillText(text, 1024, cy);
    // ombre portée sombre (relief)
    ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 4;
    const g = ctx.createLinearGradient(0, cy - size * 0.45, 0, cy + size * 0.45);
    g.addColorStop(0, '#fbe7b0'); g.addColorStop(0.45, '#e2b764'); g.addColorStop(0.55, '#c8944a'); g.addColorStop(1, '#9c6a26');
    ctx.fillStyle = g; ctx.fillText(text, 1024, cy);
    // liseré clair en haut des lettres
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(255,240,200,.55)'; ctx.strokeText(text, 1024, cy - 1);
    ctx.restore();
  });
}

// Texte le long d'un arc (bas d'un médaillon), lettres claires cernées de brun
function arcText(ctx, text, cx, cy, r, centerDeg, size) {
  ctx.save();
  ctx.font = `800 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const spacing = size * 0.06;
  const widths = [...text].map(ch => ctx.measureText(ch).width + spacing);
  const total = widths.reduce((a, b) => a + b, 0) - spacing;
  let acc = 0;
  [...text].forEach((ch, i) => {
    const mid = acc + widths[i] / 2 - spacing / 2;
    const theta = centerDeg + ((total / 2 - mid) / r) * 180 / Math.PI;
    const t = theta * Math.PI / 180;
    ctx.save();
    ctx.translate(cx + r * Math.cos(t), cy + r * Math.sin(t));
    ctx.rotate((theta - 90) * Math.PI / 180);
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#3a2610'; ctx.strokeText(ch, 0, 0);
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, '#f6dfa6'); g.addColorStop(1, '#d3a85e');
    ctx.fillStyle = g; ctx.fillText(ch, 0, 0);
    ctx.restore();
    acc += widths[i];
  });
  ctx.restore();
}

// ---------- Corrections propres à l'épisode 2 ----------
function paperColor(ctx, x, y, w, h, minLum = 170) {
  const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (lum(d[i], d[i + 1], d[i + 2]) >= minLum) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}
function avgColor(ctx, x, y, w, h) {
  const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}
function patch(ctx, color, x, y, w, h, feather = 10) {
  ctx.save(); ctx.fillStyle = color;
  ctx.filter = `blur(${feather}px)`; ctx.fillRect(x, y, w, h);
  ctx.filter = 'none'; ctx.fillRect(x + feather, y + feather / 2, w - 2 * feather, h - feather);
  ctx.restore();
}
function goldText(ctx, text, cx, cy, size) {
  ctx.save(); ctx.font = `700 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
  g.addColorStop(0, '#f3d79b'); g.addColorStop(0.5, '#d9ac5c'); g.addColorStop(1, '#a8772f');
  ctx.shadowColor = 'rgba(230,180,90,.35)'; ctx.shadowBlur = 6; ctx.fillStyle = g; ctx.fillText(text, cx, cy);
  ctx.restore();
}
function inkText(ctx, text, cx, cy, size, angle, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle * Math.PI / 180);
  ctx.font = `700 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text, 0, 0); ctx.restore();
}
function fixEpisode2(ctx) {
  // « JIDOKA (Qualité à la Source) » en double → « FLUX TIRÉ »
  patch(ctx, avgColor(ctx, 1000, 1395, 30, 60), 672, 1392, 334, 96, 8);
  goldText(ctx, 'FLUX TIRÉ', 836, 1438, 44);
  // « SDIVI SUIVI VSM » → « SUIVI VSM » (bandeau du carnet, en perspective)
  const paper = paperColor(ctx, 1215, 1560, 230, 70);
  const quad = [[1208, 1586], [1445, 1526], [1448, 1560], [1208, 1614]];
  ctx.save(); ctx.fillStyle = paper; ctx.filter = 'blur(3px)';
  ctx.beginPath(); quad.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
  ctx.filter = 'none'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.strokeStyle = '#1d1712'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(1355, 1585.8); ctx.lineTo(1471, 1551.5); ctx.stroke(); ctx.restore();
  inkText(ctx, 'SUIVI VSM', 1326, 1572, 28, -13.5, '#241b13');
}

function fixEpisode5(ctx) {
  // Médaillon 5 : « AFFINER » en double → « FONDRE » (l'image montre une coulée d'or)
  eraseAll(ctx, [{ arc: [1783, 1518, 126, 190, 48, 133] }], { cap: false });
  arcText(ctx, 'FONDRE', 1783, 1518, 160, 90, 50);
}

(async () => {
  await document.fonts.load('700 40px Montserrat');
  await document.fonts.load('800 40px Montserrat');
  await document.fonts.load('800 100px Cinzel');
  const img = new Image(); img.src = `ep-${EP}-gemini.jpg`; await img.decode();
  const ctx = document.getElementById('c').getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  if (EP === 2) fixEpisode2(ctx);
  if (EP === 5) fixEpisode5(ctx);
  eraseAll(ctx, ERASE[EP] || []);
  if (TITLE[EP]) drawTitle(ctx, TITLE[EP]);
  document.title = 'done';
})();
</script>
</body></html>
