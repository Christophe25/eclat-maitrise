<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@600;700;800&family=Patrick+Hand&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<script>
// Retouches des illustrations Gemini (originaux ep-N-gemini.jpg, taille quelconque).
// Usage : retouch.html?ep=N  → rendu à capturer avec Chrome headless.
//
// Toutes les images : suppression du titre « L'ÉCLAT MAÎTRISÉ ».
// Épisode 1 : « JOAILLERIE & LEAN MANAGEMENT » remonté en titre.
// Épisodes 2 à 4 : suppression de « JOAILLERIE & LEAN MANAGEMENT », de la ligne
// « ÉPISODE N » et du thème, puis thème réécrit en haut, en taille de titre.
// Épisode 2 : corrections de texte (doublon Jidoka, faute sur le carnet).

const EP = Number(new URLSearchParams(location.search).get('ep'));

// Zones à effacer [x0, y0, x1, y1] (coordonnées de l'original 2048 px)
const ERASE = {
};

// Thème réécrit en haut, en taille de titre : lignes, centres verticaux, largeur max
const TITLE = {
};

const lum = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;

// Reconstitue le fond de toutes les zones à la fois par diffusion (inpainting
// harmonique multi-échelle) : chaque pixel effacé prend la moyenne de ses voisins,
// jusqu'à un fond continu qui raccorde partout avec le pourtour, sans raccords.
// Les pixels clairs du pourtour (texte, ornements) sont assombris pour ne pas
// « baver » dans la zone. Un léger grain imite ensuite la texture.
// Une zone est soit un rectangle [x0, y0, x1, y1], soit un arc
// { arc: [cx, cy, r0, r1, a0, a1] } (angles en degrés, y vers le bas).
function zoneBox(z) {
  if (z.mask) return z.box;
  if (z.poly) { const xs = z.poly.map(q => q[0]), ys = z.poly.map(q => q[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)].map(Math.round); }
  if (z.rot) { const [cx, cy, w, h] = z.rot, r = Math.hypot(w, h) / 2; return [cx - r, cy - r, cx + r, cy + r].map(Math.round); }
  if (!z.arc) return z;
  const [cx, cy, , r1] = z.arc; return [cx - r1, cy - r1, cx + r1, cy + r1];
}
function inZone(z, x, y) {
  if (z.mask) {
    const [x0, y0, x1] = z.box;
    return z.mask[(y - y0) * (x1 - x0) + (x - x0)] === 1;
  }
  if (z.poly) {
    let inside = false;
    for (let i = 0, j = z.poly.length - 1; i < z.poly.length; j = i++) {
      const [xi, yi] = z.poly[i], [xj, yj] = z.poly[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  if (z.rot) {
    const [cx, cy, w, h, deg] = z.rot, t = -deg * Math.PI / 180;
    const dx = x - cx, dy = y - cy;
    const lx = dx * Math.cos(t) - dy * Math.sin(t), ly = dx * Math.sin(t) + dy * Math.cos(t);
    return Math.abs(lx) <= w / 2 && Math.abs(ly) <= h / 2;
  }
  if (!z.arc) return x >= z[0] && x < z[2] && y >= z[1] && y < z[3];
  const [cx, cy, r0, r1, a0, a1] = z.arc;
  const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy);
  const a = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  return r >= r0 && r <= r1 && a >= a0 && a <= a1;
}
function eraseAll(ctx, zones, { cap = true, lightBorder = false } = {}) {
  if (!zones.length) return;
  const boxes = zones.map(zoneBox);
  const M = 24;
  let bx0 = Math.min(...boxes.map(z => z[0])) - M, by0 = Math.min(...boxes.map(z => z[1])) - M;
  let bx1 = Math.max(...boxes.map(z => z[2])) + M, by1 = Math.max(...boxes.map(z => z[3])) + M;
  bx0 = Math.max(0, bx0); by0 = Math.max(0, by0); bx1 = Math.min(ctx.canvas.width, bx1); by1 = Math.min(ctx.canvas.height, by1);
  const w = bx1 - bx0, h = by1 - by0, N = w * h;
  const img = ctx.getImageData(bx0, by0, w, h);
  const mask = new Uint8Array(N);
  zones.forEach((z, k) => {
    const [x0, y0, x1, y1] = boxes[k];
    for (let y = Math.max(by0, y0); y < Math.min(by1, y1); y++) for (let x = Math.max(bx0, x0); x < Math.min(bx1, x1); x++)
      if (inZone(z, x, y)) mask[(y - by0) * w + (x - bx0)] = 1;
  });
  const C = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
  const CAP = 55;
  for (let i = 0; i < N; i++) {
    let r = img.data[i * 4], g = img.data[i * 4 + 1], b = img.data[i * 4 + 2];
    const l = lum(r, g, b);
    if (cap && !mask[i] && l > CAP) { const f = CAP / l; r *= f; g *= f; b *= f; }
    // fond clair : les traits sombres voisins (texte conservé) ne doivent pas « déteindre » dans la zone
    if (lightBorder && !mask[i] && l < (lightBorder === true ? 170 : lightBorder)) { r = g = b = -1; }
    C[0][i] = r; C[1][i] = g; C[2][i] = b;
  }

  if (lightBorder) {
    let m0 = 0, m1 = 0, m2 = 0, mn = 0;
    for (let i = 0; i < N; i++) if (!mask[i] && C[0][i] >= 0) { m0 += C[0][i]; m1 += C[1][i]; m2 += C[2][i]; mn++; }
    for (let i = 0; i < N; i++) if (C[0][i] < 0) { C[0][i] = m0 / mn; C[1][i] = m1 / mn; C[2][i] = m2 / mn; }
  }
  // 1) Grossier (cellules de 8 px) : beaucoup d'itérations pour les grandes longueurs d'onde
  const F = 8, cw = Math.ceil(w / F), ch = Math.ceil(h / F), CN = cw * ch;
  const cknown = new Uint8Array(CN), cv = [new Float32Array(CN), new Float32Array(CN), new Float32Array(CN)];
  for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
    let n = 0, s0 = 0, s1 = 0, s2 = 0;
    for (let y = cy * F; y < Math.min(h, cy * F + F); y++) for (let x = cx * F; x < Math.min(w, cx * F + F); x++) {
      const i = y * w + x; if (!mask[i]) { n++; s0 += C[0][i]; s1 += C[1][i]; s2 += C[2][i]; }
    }
    const k = cy * cw + cx;
    if (n > F * F / 2) { cknown[k] = 1; cv[0][k] = s0 / n; cv[1][k] = s1 / n; cv[2][k] = s2 / n; }
  }
  // point de départ des cellules inconnues : moyenne des cellules connues (évite un fond qui reste sombre)
  {
    let m0 = 0, m1 = 0, m2 = 0, mn = 0;
    for (let k = 0; k < CN; k++) if (cknown[k]) { m0 += cv[0][k]; m1 += cv[1][k]; m2 += cv[2][k]; mn++; }
    for (let k = 0; k < CN; k++) if (!cknown[k]) { cv[0][k] = m0 / mn; cv[1][k] = m1 / mn; cv[2][k] = m2 / mn; }
  }
  for (let it = 0; it < 6000; it++) {
    for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
      const k = cy * cw + cx; if (cknown[k]) continue;
      for (let c = 0; c < 3; c++) {
        let s = 0, n = 0;
        if (cx > 0) { s += cv[c][k - 1]; n++; } if (cx < cw - 1) { s += cv[c][k + 1]; n++; }
        if (cy > 0) { s += cv[c][k - cw]; n++; } if (cy < ch - 1) { s += cv[c][k + cw]; n++; }
        cv[c][k] = s / n;
      }
    }
  }
  // 2) Initialisation pleine résolution par interpolation bilinéaire du grossier
  const sample = (c, fx, fy) => {
    const x = Math.min(cw - 1, Math.max(0, fx)), y = Math.min(ch - 1, Math.max(0, fy));
    const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(cw - 1, x0 + 1), y1 = Math.min(ch - 1, y0 + 1);
    const tx = x - x0, ty = y - y0;
    return (cv[c][y0 * cw + x0] * (1 - tx) + cv[c][y0 * cw + x1] * tx) * (1 - ty) +
           (cv[c][y1 * cw + x0] * (1 - tx) + cv[c][y1 * cw + x1] * tx) * ty;
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (!mask[i]) continue;
    for (let c = 0; c < 3; c++) C[c][i] = sample(c, x / F - 0.5, y / F - 0.5);
  }
  // 3) Affinage pleine résolution (raccord précis avec le pourtour)
  for (let it = 0; it < 120; it++) {
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x; if (!mask[i]) continue;
      for (let c = 0; c < 3; c++) C[c][i] = (C[c][i - 1] + C[c][i + 1] + C[c][i - w] + C[c][i + w]) / 4;
    }
  }
  // 4) Grain et écriture
  let seed = 1234;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) - 0.5;
  for (let i = 0; i < N; i++) {
    if (!mask[i]) continue;
    const n = rand() * 5;
    img.data[i * 4] = C[0][i] + n; img.data[i * 4 + 1] = C[1][i] + n; img.data[i * 4 + 2] = C[2][i] + n;
  }
  ctx.putImageData(img, bx0, by0);
}

// Titre doré gravé, police à empattements (proche de l'ancien « L'ÉCLAT MAÎTRISÉ »)
function drawTitle(ctx, { lines, y, maxWidth, maxSize }) {
  const font = size => `800 ${size}px Cinzel`;
  let size = maxSize;
  ctx.font = font(size);
  while (size > 40 && Math.max(...lines.map(l => ctx.measureText(l).width)) > maxWidth) ctx.font = font(--size);
  lines.forEach((text, i) => {
    const cy = y[i];
    ctx.save();
    ctx.font = font(size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // halo doux
    ctx.shadowColor = 'rgba(240,190,100,.45)'; ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillText(text, ctx.canvas.width / 2, cy);
    // ombre portée sombre (relief)
    ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 4;
    const g = ctx.createLinearGradient(0, cy - size * 0.45, 0, cy + size * 0.45);
    g.addColorStop(0, '#fbe7b0'); g.addColorStop(0.45, '#e2b764'); g.addColorStop(0.55, '#c8944a'); g.addColorStop(1, '#9c6a26');
    ctx.fillStyle = g; ctx.fillText(text, ctx.canvas.width / 2, cy);
    // liseré clair en haut des lettres
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(255,240,200,.55)'; ctx.strokeText(text, ctx.canvas.width / 2, cy - 1);
    ctx.restore();
  });
}

// Texte le long d'un arc (bas d'un médaillon), lettres claires cernées de brun
function arcText(ctx, text, cx, cy, r, centerDeg, size) {
  ctx.save();
  ctx.font = `800 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const spacing = size * 0.06;
  const widths = [...text].map(ch => ctx.measureText(ch).width + spacing);
  const total = widths.reduce((a, b) => a + b, 0) - spacing;
  let acc = 0;
  [...text].forEach((ch, i) => {
    const mid = acc + widths[i] / 2 - spacing / 2;
    const theta = centerDeg + ((total / 2 - mid) / r) * 180 / Math.PI;
    const t = theta * Math.PI / 180;
    ctx.save();
    ctx.translate(cx + r * Math.cos(t), cy + r * Math.sin(t));
    ctx.rotate((theta - 90) * Math.PI / 180);
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#3a2610'; ctx.strokeText(ch, 0, 0);
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, '#f6dfa6'); g.addColorStop(1, '#d3a85e');
    ctx.fillStyle = g; ctx.fillText(ch, 0, 0);
    ctx.restore();
    acc += widths[i];
  });
  ctx.restore();
}

// ---------- Corrections propres à l'épisode 2 ----------
function paperColor(ctx, x, y, w, h, minLum = 170) {
  const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (lum(d[i], d[i + 1], d[i + 2]) >= minLum) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}
function avgColor(ctx, x, y, w, h) {
  const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}
function patch(ctx, color, x, y, w, h, feather = 10) {
  ctx.save(); ctx.fillStyle = color;
  ctx.filter = `blur(${feather}px)`; ctx.fillRect(x, y, w, h);
  ctx.filter = 'none'; ctx.fillRect(x + feather, y + feather / 2, w - 2 * feather, h - feather);
  ctx.restore();
}
function goldText(ctx, text, cx, cy, size) {
  ctx.save(); ctx.font = `700 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
  g.addColorStop(0, '#f3d79b'); g.addColorStop(0.5, '#d9ac5c'); g.addColorStop(1, '#a8772f');
  ctx.shadowColor = 'rgba(230,180,90,.35)'; ctx.shadowBlur = 6; ctx.fillStyle = g; ctx.fillText(text, cx, cy);
  ctx.restore();
}
function inkText(ctx, text, cx, cy, size, angle, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle * Math.PI / 180);
  ctx.font = `700 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text, 0, 0); ctx.restore();
}
function fixEpisode2(ctx) {
  // « JIDOKA (Qualité à la Source) » en double → « FLUX TIRÉ »
  patch(ctx, avgColor(ctx, 1000, 1395, 30, 60), 672, 1392, 334, 96, 8);
  goldText(ctx, 'FLUX TIRÉ', 836, 1438, 44);
  // « SDIVI SUIVI VSM » → « SUIVI VSM » (bandeau du carnet, en perspective)
  const paper = paperColor(ctx, 1215, 1560, 230, 70);
  const quad = [[1208, 1586], [1445, 1526], [1448, 1560], [1208, 1614]];
  ctx.save(); ctx.fillStyle = paper; ctx.filter = 'blur(3px)';
  ctx.beginPath(); quad.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
  ctx.filter = 'none'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.strokeStyle = '#1d1712'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(1355, 1585.8); ctx.lineTo(1471, 1551.5); ctx.stroke(); ctx.restore();
  inkText(ctx, 'SUIVI VSM', 1326, 1572, 28, -13.5, '#241b13');
}

function scriptText(ctx, text, x, y, size, deg) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(deg * Math.PI / 180);
  ctx.font = `600 ${size}px "Dancing Script"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(28, 26, 28, .93)';
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function fixEpisode1(ctx) {
  // Thème « carnet » : on retire « L'ÉCLAT MAÎTRISÉ » et « ÉPISODE 1 » (on garde « Joaillerie & Lean Management »)
  // contour mesuré au plus près : le bas du titre frôle le haut de « Joaillerie & Lean Management »
  eraseAll(ctx, [{ poly: [
    [700, 400], [780, 372], [1000, 352], [1300, 318], [1530, 282], [1595, 282],
    [1595, 388], [1560, 392], [1480, 401], [1470, 404], [1390, 410], [1290, 420], [1215, 429],
    [1180, 444], [1105, 446], [1050, 456], [1000, 462], [960, 463], [900, 470], [870, 474],
    [820, 479], [760, 483], [700, 483],
  ] }], { cap: false });
  eraseAll(ctx, [[1045, 500, 1300, 552]], { cap: false });
  eraseAll(ctx, [[795, 355, 818, 378]], { cap: false }); // point isolé au-dessus du titre effacé
  // « la muiede » (illisible) → « l'unité » ; « de mesure » conservé
  eraseAll(ctx, [{ poly: [[782, 794], [958, 794], [958, 834], [880, 836], [860, 846], [782, 846]] }], { cap: false });
  scriptText(ctx, 'l’unité', 862, 826, 40, -5);
  // 2e « la tradition suisse » (vers « Gestion de la valeur ») → « le savoir-faire »
  eraseAll(ctx, [[828, 1100, 1003, 1180]], { cap: false });
  scriptText(ctx, 'le savoir-', 915, 1122, 40, -7);
  scriptText(ctx, 'faire', 920, 1158, 40, -7);
}

function fixEpisode2Carnet(ctx) {
  // Version « Cartier joaillerie » : le médaillon de la bague finie (arrivée du flux) portait
  // un « 6 » en doublon avec « 6 · CONTRÔLE » : on vide sa pastille.
  eraseAll(ctx, [[1750, 726, 1782, 761]], { cap: false, lightBorder: true });
}

function fixEpisode3Carnet(ctx) {
  // « LES 7 GASPILLAGES » en double (sous « Joaillerie & Lean Management ») : on garde le titre.
  // Contour calé sur une grille de 10 px : sous le « g » de « Management », au-dessus du médaillon 3.
  eraseAll(ctx, [{ poly: [[912, 525], [1180, 500], [1300, 490], [1385, 488], [1400, 478], [1462, 468],
    [1462, 545], [1400, 549], [1300, 556], [1180, 575], [912, 602]] }], { cap: false, lightBorder: true });
  // « le métl immobilisé » (faute ; doublon de l'annotation sous STOCKS)
  eraseAll(ctx, [{ poly: [[1162, 1316], [1300, 1296], [1352, 1296], [1360, 1302], [1400, 1302], [1400, 1374], [1162, 1380]] }], { cap: false, lightBorder: true });
  // derniers points (accent et hampes) au ras de « le flux perturbé »
  eraseAll(ctx, [[1352, 1291, 1370, 1308], [1386, 1290, 1403, 1306], [1394, 1304, 1409, 1321]], { cap: false, lightBorder: true });
  // sa flèche, sous le bord de l'établi
  eraseAll(ctx, [{ poly: [[1076, 1214], [1100, 1214], [1102, 1250], [1116, 1282], [1144, 1308], [1170, 1326],
    [1160, 1346], [1128, 1324], [1096, 1292], [1080, 1254]] }], { cap: false, lightBorder: true });
}

// Pixellisation de Gemini : léger flou de profondeur hors du carnet (décor, établi, outils)
function softenDecor(ctx, quad = [[342, 396], [1938, 222], [2178, 1470], [546, 1728]]) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const soft = document.createElement('canvas'); soft.width = W; soft.height = H;
  const sc = soft.getContext('2d'); sc.filter = 'blur(2.5px)'; sc.drawImage(ctx.canvas, 0, 0);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H);
  quad.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath(); ctx.clip('evenodd');
  ctx.drawImage(soft, 0, 0);
  ctx.restore();
}

function fixEpisode5Joaillerie(ctx) {
  // 5e médaillon sans libellé (pastille « 3 » en doublon) en haut à droite : effacé
  eraseAll(ctx, [{ poly: [[1652, 712], [1932, 712], [1932, 950], [1652, 950]] }], { cap: false, lightBorder: 120 });
  softenDecor(ctx);
}

function fixEpisode12(ctx) {
  // Médaillon en bas à gauche (pastille « 3 », libellé « 2 · ASSISTER ») : doublon → effacé
  eraseAll(ctx, [{ poly: [[585, 1205], [680, 1170], [792, 1170], [818, 1194], [902, 1214], [904, 1440], [880, 1478],
    [862, 1506], [700, 1512], [640, 1500], [612, 1462], [585, 1440]] }], { cap: false, lightBorder: 120 });
  softenDecor(ctx);
}

function fixEpisode5(ctx) {
  // Thème « carnet » : médaillon 5 (coulée de métal) libellé « AFFINER » en double → « FONDRE »
  eraseAll(ctx, [{ poly: [[1830, 1241], [1953, 1212], [2002, 1216], [2006, 1238], [1957, 1267], [1833, 1282]] }], { cap: false });
  ctx.save();
  ctx.translate(1913, 1243); ctx.rotate(-9 * Math.PI / 180);
  ctx.font = '40px "Patrick Hand"'; ctx.letterSpacing = '2px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(38, 36, 40, .92)';
  ctx.fillText('FONDRE', 0, 0);
  ctx.restore();
}

// Retire les traits dorés fins d'une zone (box en pixels de l'image) : un pixel est retenu
// s'il est nettement plus « chaud » (r − b) que son voisinage, puis on reconstitue le fond.
function removeGold(ctx, box, H, { Rb = 12, R = 3, diff = 20, minWarm = 38, minG = 12, protectDark = 0 } = {}) {
  const [bx0, by0, bx1, by1] = [box[0], Math.max(0, box[1]), box[2], Math.min(H, box[3])];
  const bw = bx1 - bx0, bh = by1 - by0;
  const px = ctx.getImageData(bx0, by0, bw, bh).data;
  // « chaleur » d'un pixel = r − b ; un trait doré est nettement plus chaud que son voisinage
  const warm = new Float32Array(bw * bh);
  for (let i = 0; i < bw * bh; i++) warm[i] = px[i * 4] - px[i * 4 + 2];
  // moyenne locale (boîte 25 × 25) via image intégrale
  const I = new Float64Array((bw + 1) * (bh + 1));
  for (let y = 0; y < bh; y++) { let row = 0; for (let x = 0; x < bw; x++) { row += warm[y * bw + x]; I[(y + 1) * (bw + 1) + x + 1] = I[y * (bw + 1) + x + 1] + row; } }
  
  const gold = new Uint8Array(bw * bh);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const xa = Math.max(0, x - Rb), xb = Math.min(bw, x + Rb + 1), ya = Math.max(0, y - Rb), yb = Math.min(bh, y + Rb + 1);
    const sum = I[yb * (bw + 1) + xb] - I[ya * (bw + 1) + xb] - I[yb * (bw + 1) + xa] + I[ya * (bw + 1) + xa];
    const mean = sum / ((xb - xa) * (yb - ya));
    const i = y * bw + x, g = px[i * 4 + 1] - px[i * 4 + 2];
    if (warm[i] - mean > diff && warm[i] > minWarm && g > minG) gold[i] = 1;
  }
  // élargissement de 3 px pour englober le liseré des traits
  const mask = new Uint8Array(bw * bh);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    if (!gold[y * bw + x]) continue;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= bw || yy >= bh) continue;
      const j = yy * bw + xx;
      // option : ne jamais effacer les pixels sombres et neutres voisins (liserés gris, texte)
      if (protectDark && lum(px[j * 4], px[j * 4 + 1], px[j * 4 + 2]) < protectDark && Math.abs(px[j * 4] - px[j * 4 + 2]) < 22) continue;
      mask[j] = 1;
    }
  }
  if (new URLSearchParams(location.search).has('debug')) {
    const out = ctx.getImageData(bx0, by0, bw, bh);
    for (let i = 0; i < bw * bh; i++) if (mask[i]) { out.data[i * 4] = 255; out.data[i * 4 + 1] = 0; out.data[i * 4 + 2] = 255; }
    ctx.putImageData(out, bx0, by0);
  } else {
    eraseAll(ctx, [{ mask, box: [bx0, by0, bx1, by1] }], { cap: false });
  }
}

async function renderHero() {
  const S = 1.2, Y0 = 126, H = 1188;           // maquette 2400 × 1792 ; zones notées sur une vue 2000 px
  const img = document.getElementById('heroSrc');
  if (!img.complete || !img.naturalWidth) await new Promise(r => img.addEventListener('load', r, { once: true }));
  const canvas = document.getElementById('c');
  canvas.width = 2400; canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, Y0, 2400, H, 0, 0, 2400, H);
  const z = (x0, y0, x1, y1) => [x0 * S, y0 * S - Y0, x1 * S, y1 * S - Y0].map(Math.round);
  [
    z(0, 105, 445, 590),        // ornement en filigrane (non repris)
    z(125, 175, 470, 245),      // badge
    z(125, 265, 760, 388),      // titre
    z(125, 405, 1095, 552),     // accroche
    z(125, 595, 620, 692),      // chiffres
    z(100, 848, 622, 927),      // onglets
    z(1565, 150, 1922, 324),    // QR code
    z(105, 958, 688, 1095),     // haut des cartes
    z(720, 958, 1302, 1095),
    z(1333, 958, 1918, 1095),
  ].map(r => [r[0], Math.max(0, r[1]), r[2], Math.min(H, r[3])]).forEach(r => eraseAll(ctx, [r], { cap: false }));

  // Diamants en filet doré : on ne retire que leurs traits
  removeGold(ctx, z(1200, 245, 1860, 578), H);                       // grand diamant, en haut à droite
  removeGold(ctx, [1115, 715, 1315, 822], H, { Rb: 10, R: 3, diff: 5, minWarm: 10, minG: 4, protectDark: 175 });
  removeGold(ctx, [1115, 737, 1315, 822], H, { Rb: 10, R: 2, diff: 3, minWarm: 6, minG: 2, protectDark: 175 }); // 2e passage : traces pâles // miniature sur l'écran de la tablette
  document.title = 'done';
}

if (new URLSearchParams(location.search).has('hero')) document.getElementById('heroSrc').src = '../maquette-accueil.jpeg';

(async () => {
  if (new URLSearchParams(location.search).has('hero')) { await renderHero(); return; }
  await document.fonts.load('700 40px Montserrat');
  await document.fonts.load('800 40px Montserrat');
  await document.fonts.load('800 100px Cinzel');
  await document.fonts.load('62px "Patrick Hand"');
  await document.fonts.load('600 40px "Dancing Script"');
  // Mode « hero » : fond photo de la page d'accueil, extrait de la maquette
  if (new URLSearchParams(location.search).has('hero')) { await renderHero(); return; }
  const img = new Image(); img.src = `ep-${EP}-gemini.jpg`; await img.decode();
  const canvas = document.getElementById('c');
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  if (EP === 2) fixEpisode2Carnet(ctx);
  // ép. 1 : la version « Cartier joaillerie » (L'HÉRITAGE) est publiée telle quelle
  if (EP === 3) fixEpisode3Carnet(ctx);
  if (EP === 5) fixEpisode5Joaillerie(ctx); // ancienne version « carnet bilan matière » : fixEpisode5
  if (EP === 12) fixEpisode12(ctx);
  eraseAll(ctx, ERASE[EP] || []);
  if (TITLE[EP]) drawTitle(ctx, TITLE[EP]);
  document.title = 'done';
})();
</script>
